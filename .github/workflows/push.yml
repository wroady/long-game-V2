name: Push reminders

# Native Web Push reminders. Web Push can't schedule delivery for a future minute (unlike ntfy's At
# header), so this wakes up every ~5 minutes and sends whatever reminders came due since the last
# run. .push-sent.json (kept via actions/cache) records what already went to which device so nothing
# is sent twice. GitHub cron can run several minutes late, so reminders may arrive a few minutes
# after their set time.
#
# Manual test: Actions tab > Push reminders > Run workflow > tick "test" (sends a test notification
# to every device that has reminders turned on), or: gh workflow run push.yml -f test=true

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification to every device now'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - id: day
        run: echo "d=$(TZ=America/Detroit date +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .push-sent.json
          key: push-sent-${{ steps.day.outputs.d }}-${{ github.run_id }}
          restore-keys: push-sent-${{ steps.day.outputs.d }}-
      - id: send
        run: node scripts/schedule-notifications.mjs ${{ inputs.test && '--push-test' || '--push-tick' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - if: steps.send.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .push-sent.json
          key: push-sent-${{ steps.day.outputs.d }}-${{ github.run_id }}
